name: light-notebook
services:
  app:
    image: light-notebook:${APP_RELEASE:-server-prep}
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_DIR: /app/data
      STATIC_DIR: /app/dist
      TRUST_PROXY: "true"
    expose: ["8080"]
    volumes: ["app_data:/app/data"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.25
    stop_grace_period: 80s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?请填写.env中的SITE_ADDRESS}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.50
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  app_data:
  caddy_data:
  caddy_config:
